<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>

        /* 기본 베이스 설정(*=전체 선택자/@e 같은거임) */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        .box1 {
            border: 2px solid blue;
            padding: 15px;
            margin: 30px;
        }

        .box2 {
            margin: 50px;
            padding-left: 30px;

            border-width: 3px;
            border-style: dashed;
            border-color: red;

            width: 200px;
            height: 150px;

            /* box-sizing: border-box; */
            /* box-sizing: content-box; */
        }
    </style>
</head>
<body>
    <div class="box1">
        box1
    </div>

    <div class="box2">
        box2
    </div>

    <p>다른 요소 p태그</p>
</body>
</html>
