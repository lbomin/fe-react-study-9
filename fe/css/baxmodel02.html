<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            margin: 0; /* 외부 여백 0 */
            padding: 0; /* 내부 여백 0 */
            box-sizing: border-box; /* 박스모델 사이즈 지정, border까지 사이즈로 인식 */
        }

        /* 
        display 속성
        none         : 화면에 표시되지 않음
        block        : 블록 요소, 줄바꿈 발생, width, height 지정 가능, 기본적으로 같이 배치되지 않음, 여백 적용 가능
        inline       : 인라인 요소, 줄바꿈 발생하지 않음, 사이즈 지정 불가, 여백 적용 좌, 우만 가능
        inline-block : 자체적으로는 블록처럼 작용 (사이즈 지정 가능, 여백 적용 가능), 
        다만 외부적으로는 인라인처럼 작용
        */
        
        .box {
            /* div태그는 block이 기본 속성 */
            width: 200px;
            height: 100px;
            border: 1px solid black;

            margin: 10px;
            padding: 10px;
        }

        .box1 {
            /* div태그는 block이 기본 속성 */
            width: 200px;
            height: 100px;
            border: 1px solid black;

            margin: 10px;
            padding: 10px;

            display:none;
                }
        .box2 {
            /* div태그는 block이 기본 속성 */
            width: 200px;
            height: 100px;
            border: 1px solid black;

            margin: 10px;
            padding: 10px;

            display:block;
        }
        .box3 {
            /* div태그는 block이 기본 속성 */
            width: 200px;
            height: 100px;
            border: 1px solid black;

            margin: 10px;
            padding: 10px;

            display:inline-block;
        }

        .span1 {
            display:inline;
            width: 200px;
            height: 100px;
        }

        .parent {
            width: 200px;
            height: 100px;
            border: 1px solid blue;
        }

        .child {
            width: 100px;
            height: 50px;
            border: 1px solid red;

            display: none;
        }

        .parent:hover .child {
            display: block;
        }
        
        .parent:hover .parent-span {
            color: blue;
            text-decoration: underline;         
        }   
        
    </style>
    </head>
    <body>
    <div class="box box1">box1</div>
    <div class="box box2">box2</div>
    <div class="box box3">box3</div>

    <span class="span1">span1</span>
    <span>Lorem ipsum dolor, sit amet consectetur adipisicing elit. Id, sit at delectus est expedita 
        natus reiciendis, ipsa architecto tenetur sunt totam exercitationem. Soluta, perspiciatis officia. 
        Sint veniam fugit consequuntur quidem.</span>


    <div class="parent">
        <span class="parent-span">부모</span>
        <br><br>
        <div class="child">
            자식
        </div>

    </div>
</body>
</html>
