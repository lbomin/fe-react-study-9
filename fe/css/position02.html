<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box{
            width: 200px;
            height: 200px;
        }
        .red-box{
            background-color:red;
            left:100px;
            position: relative;
        }
        .green-box{
            background-color: green;
            left: 100px;
            top: 50px;
            position: absolute;
            z-index: 1;
        }
        .blue-box{
            background-color: blue;
            position: relative;
            left: -50px;
            top: -30px;
        }
        .container{
            background-color: lightblue;
            position: relative;
            
        }
    </style>
</head>
<body>
    <div class="box red-box"></div>
    <div class="box green-box"></div>
    <div class="box blue-box"></div>
    <br><br>
    <div class="container">
        <div class="box red-box"></div>
        <div class="box green-box"></div>
        <div class="blue-box"></div>
    </div>
</body>
</html>
