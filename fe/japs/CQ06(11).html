<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
         * {
            margin: 0; /* 외부 여백 0 */
            padding: 0; /* 내부 여백 0 */
            box-sizing: border-box; /* 박스모델 사이즈 지정, border까지 사이즈로 인식 */}
        .ctn{
            display: flex;
            width: 800px;
            margin: 0 auto;
            flex-wrap: wrap;
        }
        .yb1{
            background-color: yellow;
            width: 50%;
            height: 100px;
        }
        .gyb1{
            background-color: gray;
            width: 50%;
            height: 100px;
        }
        .ppb1{
            background-color: purple;
            width: 100%;
            height: 100px;
        }
        .hnb1{
            background-color: lightskyblue;
            width: 300px;
            height: 200px;
        }
        .yb2{
            background-color: yellow;
            width: 500px;
            height: 100px;
        }
        .pb1{
            background-color: pink;
            width: 500px;
            height: 100px;
        }
        .yb3{
            background-color: yellow;
            width: 200px;
            height: 100px;
        }
        .ob1{
            background-color: orange;
            width: 200px;
            height: 100px;
        }
        .grb1{
            background-color: lightgreen;
            width: 200px;
            height: 100px;
        }
        .bbx{
            width: 500px;
        }
    </style>
</head>
<body>
    <div class="ctn">
        <div class="yb1"></div>
        <div class="gyb1"></div>
        <div class="ppb1"></div>
        <div class="hnb1"></div>
        <div class="bbx">
        <div class="yb2"></div>
        <div class="pb1"></div>
        </div>
        <div class="yb3"></div>
        <div class="ob1"></div>
        <div class="yb3"></div>
        <div class="grb1"></div>
    </div>  
</body>
</html>
