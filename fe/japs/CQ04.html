<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            margin: 0; /* 외부 여백 0 */
            padding: 0; /* 내부 여백 0 */
            box-sizing: border-box; /* 박스모델 사이즈 지정, border까지 사이즈로 인식 */
        }
        .h3{
            background-color: lightgray;
            font-weight: 700;
            font-size: 20px;
        }
        .box {
            /* div태그는 block이 기본 속성 */
            width: 500px;
            height: 300px;
            border: 5px solid black;

            margin: 20px;
            padding: 10px;
            display: inline-block;
            position: relative;
            left: 50px;
            top: 70px;
        }
        .red-box{
            background-color:red;
            width: 100px;
            height: 100px;
            position: absolute;
            top: 0px;
            left: 0px;
        }
        .y-box{
            background-color:yellow;
            width: 100px;
            height: 100px;
            position: absolute;
            top: 100px;
            left: 0px;
        }
        .g-box{
            background-color:green;
            width: 100px;
            height: 100px;
            position: absolute;
            top: 50px;
            left: 50px;
            z-index: 1;
        }
    </style>
</head>
<body>
    <div class="h3">
        <div>배경색이 lightgray</div> 
        <div>h3글자</div>
    </div>
    <div class="box">
        <div class="red-box">A</div>
        <div class="g-box">B</div>
        <div class="y-box">C</div>
    </div>
</body>
</html>
