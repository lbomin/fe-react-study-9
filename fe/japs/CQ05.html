<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            margin: 0; /* 외부 여백 0 */
            padding: 0; /* 내부 여백 0 */
            box-sizing: border-box; /* 박스모델 사이즈 지정, border까지 사이즈로 인식 */
        }
        .con{
            width: 500px;
            margin: 0 auto;
            margin-top: 50px;
        }
        .box{
            width: 500px;
            display: inline-block;
            text-align: center;
            
        }
        .r-b{
            background-color: red;
            width: 250px;
            height: 100px;
        }
        .g-b{
            background-color: green;
            width: 250px;
            height: 100px;
        }
        .r-b, .g-b {display: inline-block;}
        .b-b{
            width: 500px;
            height: 200px;
            background-color: blue;
        }
    </style>
</head>
<body>
    <div class="con">
        <div class="box">
            <div class="r-b"></div><div class="g-b"></div>
            <p>글자가운데정렬</p>
            <div class="b-b"></div>
        </div>
    </div>
</body>
</html>
