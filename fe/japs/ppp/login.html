<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        .ctn{
            width: 500px;
            margin: 0 auto;
        }
        .box{
            background-color: rgb(63, 63, 63);
            color: white;
            font-size: 33px;
            text-align: center;
            box-sizing: border-box;

        }
        input{
            width: 400px;
            height: 30px;
            margin: 20px;
            background: transparent;
            border: 1px solid rgb(139, 139, 139);
            color: rgb(255, 255, 255);
            padding: 10px;
            outline: none;
            font-size: 20px;
        }
        input::placeholder {
            color: rgb(116, 98, 98);
            font-size: 20px;
        }
        .b001 {
            margin-bottom: 20px;
            font-weight:300;
        }
        #login-btn {
            width: 400px;
            height: 70px;
            background-color: rgb(0, 207, 111);
            color: rgb(255, 255, 255);
            border: none;
            font-size: 30px;
            font-weight: 600;
            cursor: pointer;
        }
    </style>
    <title>Document</title>
</head>
<body>
    <div class="ctn">
        <div class="box">
            <div class="b001">Welcome Back!</div>
            <form action="main.html">
            <input type="text" id="id" name="id" placeholder="Email Address *">
            <input type="password" id="pw" name="pw" placeholder="Password *">
            <input type="submit" value="LOG IN" id="login-btn">
            </form>
        </div>
    </div>
    
</body>
</html>
