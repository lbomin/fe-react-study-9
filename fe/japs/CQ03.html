<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            margin: 0; /* 외부 여백 0 */
            padding: 0; /* 내부 여백 0 */
            box-sizing: border-box; /* 박스모델 사이즈 지정, border까지 사이즈로 인식 */
        }
        .box {
            /* div태그는 block이 기본 속성 */
            width: 200px;
            height: 100px;
            border: 1px solid black;

            margin: 20px;
            padding: 10px;
            display: inline-block;
        }
        .box1 {
            /* div태그는 block이 기본 속성 */
            width: 200px;
            height: 100px;
            border: 1px solid black;

            margin: 20px;
            padding: 10px;
            display: inline-block;
        }
    </style>
</head>
<body>
    <h1>박스 정렬</h1>
    <div class="box"></div>
    <div class="box"></div>
    <div class="box"></div>
    <div class="box"></div>
    <div class="box1"></div>    
    <div class="box1"></div>
