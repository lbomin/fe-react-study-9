<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<f>
    <form>
    <br>
    <label for="name">고객명:</label>
    <input type="text" id="name"><br><br>
    <label for="num">전화번호:</label>
    <input type="text" id="num"><br><br>
    <label for="email">이메일:</label>
    <input type="email" id="email"><br><br>
    <label for="pizza-select">피자선택:</label>
    <select id="pizza-select">
        <option selected disabled>피자를 선택하세요</option>
        <option value="margherita">마르게리타</option>
        <option value="pepperoni">페퍼로니</option>
        <option value="hawaiian">하와이안</option>
    </select>
        <fieldset>
        <legend>피자 사이즈</legend>
        <input type="radio" id="size1" name="size" value="Small">
        <label for="size1">Small</label><br><br>
        <input type="radio" id="size2" name="size" value="Medium">
        <label for="size2">Medium</label><br><br>
        <input type="radio" id="size3" name="size" value="Large">
        <label for="size3">Large</label><br><br>
    </fieldset>
    <fieldset>
        <legend>토핑 선택</legend>
        <input type="checkbox" id="topping1" name="topping" value="cheese">
        <label for="topping1">치즈</label><br><br>
        <input type="checkbox" id="topping2" name="topping" value="mushrooms">
        <label for="topping2">버섯</label><br><br>
        <input type="checkbox" id="topping3" name="topping" value="pepperoni">
        <label for="topping3">페퍼로니</label><br><br>
        <input type="checkbox" id="topping4" name="topping" value="olives">
        <label for="topping4">올리브</label><br><br>
    </fieldset>
    <br>
    <label for="time">희망배송시간:</label>
    <input type="time" id="time" name="time">
    <br>
    <br>
    <label for="Request">배송시 요청사항:</label>
    <textarea id="Request" name="Request"
          rows="5" cols="40"
          placeholder="내용을 입력하세요"></textarea><br><br>
    <BUTTON type="submit">주문하기</BUTTON><br>
    </form> 
</body>
</html>
