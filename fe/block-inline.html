<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!--블록요소 vs 인라인요소-->

    <!-- p 태그(자기 자신을 차지함) span 태그(자신의 내용만큼의 공간을 차지함)-->

    <p>첫번쨰 블록 요소</p>
    <p>두번쨰 블록 요소</p>
    <span>첫번쨰 인라인 요소</span>
    <span>두번쨰 인라인 요소</span>
    <p>세번쨰 블록 요소</p>

</body>
</html>
