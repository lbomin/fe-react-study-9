<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!--블록요소 vs 인라인요소-->   

    <!-- p 태그(자기 자신을 차지함) span 태그(자신의 내용만큼의 공간을 차지함)-->
     <!-- 블록요소는 한 줄을 차지하고, 인라인요소는 한 줄을 차지하지 않음 -->

    <p>첫번쨰 블록 요소</p>
    <p>두번쨰 블록 요소</p>
    <span>첫번쨰 인라인 요소</span>
    <span>두번쨰 인라인 요소</span>
    <p>세번쨰 블록 요소</p>

    <!-- 글로벌 속성 -->
    <!-- class 속성: 을 사용하여 스타일을 적용할 수 있음 -->
    <!-- id 속성을 사용하여 스타일을 적용할 수 있음 -->
    <!-- style 속성을 사용하여 스타일을 적용할 수 있음 -->



</body>
</html>
