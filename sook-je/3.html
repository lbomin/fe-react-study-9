<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        h1 {color: red}
        h2 {background-color: orange}
        h3 {width: 300px; height: 100px; background-color: yellow}
        h4 {margin: 20px}
        h5 {padding: 20px}
        h6 {border: 2px solid black}
        p {font-size: 20px}
        div {display: flex;}
</style>
</head>
<body>
    <p>CSS 123</p>
    <h1>CSS 기본 알아보기</h1>
    <h2>CSS란?</h2>
    <h3>CSS는 Cascading Style Sheets의 약자로, 웹페이지의 스타일을 정의하기 위한 스타일 시트 언어입니다.</h3>
    <div>
    <h4>CSS의 역할</h4>
    <h5>웹페이지의 레이아웃, 색상, 글꼴, 간격 등을 정의하여 시각적인 표현을 향상시키는 역할을 합니다.</h5>
    <h6>CSS의 사용 방법</h6>  
    </div>    
</body>
</html>

<!-- 3. CSS 기본 알아보기
CSS가 무엇이며 HTML과 어떤 관계가 있는지 조사하세요.
다음 CSS 속성을 직접 사용해 보세요.

color
background-color
width / height
margin
padding
border
font-size
display

가능하다면 display: flex를 사용했을 때 화면이 어떻게 달라지는지도 확인해 보세요. -->
